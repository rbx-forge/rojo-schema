name: Track Rojo

# Watches for a new Rojo release, re-vendors its sources, recompiles, pushes the
# result on a branch and opens an issue carrying the grammar diff. A release that
# breaks the compiler fails this job instead of producing a quietly wrong schema.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  CARGO_TERM_COLOR: always

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Compare with the latest Rojo release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest=$(gh api repos/rojo-rbx/rojo/releases/latest --jq .tag_name)
          current=$(grep -m1 '^tag = ' vendor.toml | cut -d'"' -f2)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "vendored $current, upstream $latest"

          if [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "track/$latest" >/dev/null 2>&1; then
            echo "track/$latest already exists, so $latest was already prepared"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-vendor and recompile
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cargo run --locked -- vendor --tag "${{ steps.upstream.outputs.latest }}"
          cargo run --locked -- generate

      # Nothing here starts a new workflow run: work done with GITHUB_TOKEN does
      # not trigger workflows. The checks therefore run in this job, and the
      # issue states their result.
      - name: Verify
        if: steps.upstream.outputs.changed == 'true'
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      # The branch is pushed and an issue announces it, rather than a pull
      # request being opened directly: the organization does not let Actions
      # create pull requests, and an issue notifies just as well while leaving
      # the pull request to a human.
      - name: Push the branch and open an issue
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.upstream.outputs.latest }}
        run: |
          set -euo pipefail
          base="$GITHUB_REF_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "track/$LATEST"
          git add vendor vendor.toml schema
          git commit -m "chore: vendor Rojo $LATEST and recompile the schemas"
          git push --set-upstream origin "track/$LATEST"

          diff=$(git diff --stat "origin/$base" -- schema)

          {
            echo "Rojo published [$LATEST](https://github.com/rojo-rbx/rojo/releases/tag/$LATEST)."
            echo
            echo "The vendored sources were re-copied at that tag and the schemas recompiled"
            echo "on \`track/$LATEST\`. Format, lint and tests all passed in [the job that"
            echo "prepared it](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo "**Open the pull request:** https://github.com/$GITHUB_REPOSITORY/compare/$base...track/$LATEST?expand=1"
            echo
            echo "## Grammar diff"
            echo
            if [ -z "$diff" ]; then
              echo "None. This release did not change the three file formats."
            else
              echo '```'
              echo "$diff"
              echo '```'
            fi
            echo
            echo "Read the schema diff before merging: it is the release's grammar change, in Rojo's own words."
          } > "$RUNNER_TEMP/body.md"

          gh issue create --title "Rojo $LATEST is out" --body-file "$RUNNER_TEMP/body.md"
