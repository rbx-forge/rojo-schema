[package]
name = "rojo-schema"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "Compiles JSON Schemas for Rojo project, meta and model files from vendored Rojo sources"
repository = "https://github.com/rbx-forge/rojo-schema"
license = "MPL-2.0"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
syn = { version = "3", features = ["full", "parsing", "extra-traits"] }
toml = "1"
ureq = "3"

[dev-dependencies]
# Validates the generated schemas against fixtures, so the tests assert the
# thing that matters: real Rojo files pass, malformed ones do not.
jsonschema = "0.49"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Conventions for published APIs. This crate is a tool, not a library anyone
# depends on, and its errors are already described where they are raised.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
